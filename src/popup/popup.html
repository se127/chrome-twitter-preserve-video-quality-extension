<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>X Video Quality</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1 id="heading">Video quality</h1>

      <fieldset id="quality">
        <legend id="qualityLegend">Preferred quality</legend>
        <!-- Labels are rendered by popup.js so they follow the selected language. -->
        <div id="qualityOptions"></div>
      </fieldset>

      

      <fieldset id="language">
        <legend id="languageLegend">Language</legend>
        <div id="languageOptions"></div>
      </fieldset>

      <p class="hint" id="hint"></p>
      <button id="reload" type="button" hidden></button>
    </main>
    <script src="../common/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
